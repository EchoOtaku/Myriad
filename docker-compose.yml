# Myriad Docker Compose 配置文件
#
# ============================================================================
# 环境变量配置说明
# ============================================================================
#
# 请在项目根目录创建 .env 文件并配置以下变量：
#
# --- 必需配置 (REQUIRED) ---
#
# POSTGRES_PASSWORD=your_secure_password_here
#   示例: POSTGRES_PASSWORD=MySecurePass123!@#
#   说明: PostgreSQL 数据库密码，建议使用 16+ 位强密码
#   生成: openssl rand -base64 32
#
# JWT_SECRET=your_jwt_secret_here
#   示例: JWT_SECRET=kJ8mN2pQ5rT7vX9zB3cF6hK8mP0qS4tW6yA9bD2eG5j
#   说明: JWT 认证密钥，用于用户 Token 加密（最少32字符）
#   生成: openssl rand -base64 32
#
# --- 可选配置 (OPTIONAL) ---
#
# CORS_ORIGINS=https://yourdomain.com
#   示例: CORS_ORIGINS=https://yourdomain.com,https://www.yourdomain.com
#   说明: 允许访问的前端域名，多个域名用逗号分隔（生产环境必须配置）
#   开发环境: CORS_ORIGINS=http://localhost:4321
#
# PUBLIC_API_URL=
#   示例: PUBLIC_API_URL=https://api.yourdomain.com
#   说明: 公开的 API 地址，留空则自动检测
#
# EXPOSE_DB_PORT=false
#   示例: EXPOSE_DB_PORT=true
#   说明: 是否暴露数据库端口到主机（生产环境建议false）
#

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: myriad-postgres
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      POSTGRES_DB: myriad
      POSTGRES_USER: myriad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C --lc-collate=C --lc-ctype=C"
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myriad -d myriad"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - myriad-net
    restart: unless-stopped
    # 安全加固
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
      - /run

  # Backend API
  backend:
    image: somekawahitomi/myriad-backend:latest
    container_name: myriad-backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      # Database connection
      DATABASE_URL: postgres://myriad:${POSTGRES_PASSWORD}@postgres:5432/myriad

      # Server config
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000

      # Security - REQUIRED: Generate with: openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET}

      # CORS - IMPORTANT: Set your domain in production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4321}

      # Logging
      RUST_LOG: ${RUST_LOG:-info}
      TZ: Asia/Shanghai

      # Application configs (Optional - synced to database on startup)
      GITHUB_USERNAME: ${GITHUB_USERNAME:-}
      BILIBILI_UID: ${BILIBILI_UID:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAM_ID: ${STEAM_ID:-}
      NETEASE_USER_ID: ${NETEASE_USER_ID:-}

      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}

      TOPIC_STYLE: ${TOPIC_STYLE:-}
      UI_WALLPAPER_URL: ${UI_WALLPAPER_URL:-}
      UI_WALLPAPER_BLUR: ${UI_WALLPAPER_BLUR:-3}

      IMAGE_GEN_ENABLED: ${IMAGE_GEN_ENABLED:-true}
      IMAGE_GEN_MODEL: ${IMAGE_GEN_MODEL:-flux}
      IMAGE_GEN_WIDTH: ${IMAGE_GEN_WIDTH:-512}
      IMAGE_GEN_HEIGHT: ${IMAGE_GEN_HEIGHT:-512}

      PET_ENABLED: ${PET_ENABLED:-true}
      PET_IMAGE_URL: ${PET_IMAGE_URL:-}

      PERSONA_IMAGE_ENABLED: ${PERSONA_IMAGE_ENABLED:-true}
      PERSONA_IMAGE_MODEL: ${PERSONA_IMAGE_MODEL:-flux-anime}
      PERSONA_IMAGE_WIDTH: ${PERSONA_IMAGE_WIDTH:-512}
      PERSONA_IMAGE_HEIGHT: ${PERSONA_IMAGE_HEIGHT:-1024}
      PERSONA_IMAGE_PROVIDER: ${PERSONA_IMAGE_PROVIDER:-pollinations}

      IMAGINEPRO_API_KEY: ${IMAGINEPRO_API_KEY:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - backend_cache:/app/cache
    networks:
      - myriad-net
    restart: unless-stopped
    # 安全加固
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

  # Frontend
  frontend:
    image: somekawahitomi/myriad-frontend:latest
    container_name: myriad-frontend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    environment:
      # OPTIONAL: Leave empty to auto-detect domain
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      NODE_ENV: production
      TZ: Asia/Shanghai
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4321"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - myriad-net
    restart: unless-stopped
    # 安全加固
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
    driver: local
  backend_cache:
    driver: local

networks:
  myriad-net:
    driver: bridge
