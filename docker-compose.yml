# Myriad Docker Compose 配置文件
#
# ============================================================================
# 环境变量配置说明
# ============================================================================
#
# 请在项目根目录创建 .env 文件并配置以下变量：
#
# --- 必需配置 (REQUIRED) ---
#
# POSTGRES_PASSWORD=your_secure_password_here
#   示例: POSTGRES_PASSWORD=MySecurePass123!@#
#   说明: PostgreSQL 数据库密码，建议使用 16+ 位强密码
#   生成: openssl rand -base64 32
#
# JWT_SECRET=your_jwt_secret_here
#   示例: JWT_SECRET=kJ8mN2pQ5rT7vX9zB3cF6hK8mP0qS4tW6yA9bD2eG5j
#   说明: JWT 认证密钥，用于用户 Token 加密（最少32字符）
#   生成: openssl rand -base64 32
#
# --- 可选配置 (OPTIONAL) ---
#
# CORS_ORIGINS=https://yourdomain.com
#   示例: CORS_ORIGINS=https://yourdomain.com,https://www.yourdomain.com
#   说明: 允许访问的前端域名，多个域名用逗号分隔（生产环境必须配置）
#   开发环境: CORS_ORIGINS=http://localhost:4321
#
# PUBLIC_API_URL=
#   示例: PUBLIC_API_URL=https://api.yourdomain.com
#   说明: 公开的 API 地址，留空则自动检测
#
# FRONTEND_URL=
#   示例: FRONTEND_URL=https://yourdomain.com
#   说明: 前端地址，用于 OAuth 回调重定向
#
# BASE_URL=
#   示例: BASE_URL=https://api.yourdomain.com
#   说明: 后端基础地址，用于生成 OAuth 回调 URL
#
# BACKEND_PORT=3000
#   示例: BACKEND_PORT=8080
#   说明: 后端服务暴露的主机端口
#
# FRONTEND_PORT=4321
#   示例: FRONTEND_PORT=8000
#   说明: 前端服务暴露的主机端口
#
# RUST_LOG=info
#   示例: RUST_LOG=debug
#   说明: 日志级别 (trace, debug, info, warn, error)
#
# 注意：应用配置（AI、平台集成、主题等）已迁移至数据库
#      请通过 Web UI 的设置页面进行配置管理
#

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: myriad-postgres
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      POSTGRES_DB: myriad
      POSTGRES_USER: myriad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C --lc-collate=C --lc-ctype=C"
      # PostgreSQL 性能优化
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1536MB
      POSTGRES_MAINTENANCE_WORK_MEM: 128MB
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: 0.9
      POSTGRES_WAL_BUFFERS: 16MB
      POSTGRES_DEFAULT_STATISTICS_TARGET: 100
      POSTGRES_RANDOM_PAGE_COST: 1.1
      POSTGRES_EFFECTIVE_IO_CONCURRENCY: 200
      POSTGRES_WORK_MEM: 4MB
      POSTGRES_MIN_WAL_SIZE: 1GB
      POSTGRES_MAX_WAL_SIZE: 4GB
      POSTGRES_MAX_WORKER_PROCESSES: 4
      POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER: 2
      POSTGRES_MAX_PARALLEL_WORKERS: 4
      POSTGRES_MAX_PARALLEL_MAINTENANCE_WORKERS: 2
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myriad -d myriad"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - myriad-net
    restart: unless-stopped
    # 生产环境建议：不暴露数据库端口
    # ports:
    #   - "${DB_PORT:-5432}:5432"
    # 安全加固
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
      - /run
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API
  backend:
    image: somekawahitomi/myriad-backend:latest
    container_name: myriad-backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      # Database connection
      DATABASE_URL: postgres://myriad:${POSTGRES_PASSWORD}@postgres:5432/myriad

      # Server config
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000

      # Security - REQUIRED: Generate with: openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET}

      # CORS - IMPORTANT: Set your domain in production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4321}

      # Optional: Frontend and Base URLs for OAuth callbacks
      FRONTEND_URL: ${FRONTEND_URL:-}
      BASE_URL: ${BASE_URL:-}

      # Logging
      RUST_LOG: ${RUST_LOG:-info}
      TZ: Asia/Shanghai

      # Note: 应用配置已迁移到数据库，通过 Web UI 管理
      # AI、平台集成、主题、图片生成等配置请在设置页面中配置
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - backend_cache:/app/cache
      - backend_data:/app/data
    networks:
      - myriad-net
    restart: unless-stopped
    # 安全加固
    security_opt:
      - no-new-privileges:true
    # 注意：需要写入权限用于数据库文件和缓存
    read_only: false
    tmpfs:
      - /tmp
    # 确保容器内用户有权限写入挂载的卷
    user: "0:0"  # 使用 root 用户运行，确保有写入权限
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend
  frontend:
    image: somekawahitomi/myriad-frontend:latest
    container_name: myriad-frontend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      # OPTIONAL: Leave empty to auto-detect domain
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      NODE_ENV: production
      TZ: Asia/Shanghai
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4321"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - myriad-net
    restart: unless-stopped
    # 安全加固
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  backend_cache:
    driver: local
  backend_data:
    driver: local

networks:
  myriad-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
