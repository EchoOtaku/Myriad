# =============================================================================
# Myriad Docker Compose - 使用预构建镜像
# =============================================================================
# 此配置使用 Docker Hub 上的预构建镜像，无需本地编译
# 适合快速部署和生产环境使用
# =============================================================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: myriad-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myriad}
      POSTGRES_USER: ${POSTGRES_USER:-myriad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myriad_password_change_me}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/009_create_users_table.sql:/docker-entrypoint-initdb.d/02-users.sql:ro
      - ./database/012_create_platform_metadata.sql:/docker-entrypoint-initdb.d/03-metadata.sql:ro
      - ./database/013_create_metadata_history.sql:/docker-entrypoint-initdb.d/04-history.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myriad} -d ${POSTGRES_DB:-myriad}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - myriad-network
    restart: unless-stopped

  backend:
    # 使用 Docker Hub 预构建镜像
    # 替换 YOUR_DOCKERHUB_USERNAME 为实际的 Docker Hub 用户名
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_USERNAME:-mirai-mamori}/myriad-backend:${IMAGE_TAG:-latest}
    container_name: myriad-backend
    environment:
      # Database
      DATABASE_URL: postgres://${POSTGRES_USER:-myriad}:${POSTGRES_PASSWORD:-myriad_password_change_me}@postgres:5432/${POSTGRES_DB:-myriad}
      # Server
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      FRONTEND_DIST_PATH: /app/frontend/dist
      # Security - CHANGE IN PRODUCTION!
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-use-openssl-rand-base64-32}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4321,http://localhost:3000,http://localhost:80}
      # Logging
      RUST_LOG: ${RUST_LOG:-info,myriad_backend=debug}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-1}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health", "||" , "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - myriad-network
    restart: unless-stopped
    volumes:
      - backend_cache:/app/cache

  frontend:
    # 使用 Docker Hub 预构建镜像
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_USERNAME:-mirai-mamori}/myriad-frontend:${IMAGE_TAG:-latest}
    container_name: myriad-frontend
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4321", "||" , "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - myriad-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  backend_cache:
    driver: local

networks:
  myriad-network:
    driver: bridge
