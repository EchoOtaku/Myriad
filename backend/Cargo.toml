[package]
name = "myriad-backend"
version = "0.1.0"
edition = "2021"
authors = ["Myriad Contributors"]
description = "Backend service for Myriad - Multi-platform personal information aggregation and analysis"

[[bin]]
name = "myriad-backend"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = [
    "fs",
    "cors",
    "trace",
    "set-header",
    "compression-gzip",
    "compression-br",
] }

# Database
sea-orm = { version = "0.12", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-migration = "0.12"

# Local migrations module
migration = { path = "migrations" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["json", "cookies"] }
urlencoding = "2.1"

# Authentication & Authorization
oauth2 = "4.4"
jsonwebtoken = "9.2"
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
regex = "1.10"
hmac = "0.12"        # For Tencent Cloud API signing
base64 = "0.22"      # For audio data encoding

# Configuration
config = "0.14"
dotenvy = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
cron = "0.13"                                           # For cron expression parsing
uuid = { version = "1.6", features = ["v4", "serde"] }
validator = { version = "0.18", features = ["derive"] }
rand = "0.8"
lazy_static = "1.4"
once_cell = "1.19"
futures = "0.3.31"
tokio-stream = "0.1"                                    # For SSE streaming
zip = "2.2"                                             # For .tapp file handling
md5 = "0.8.0"
quick-xml = "0.38.4"

[dev-dependencies]
mockall = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
