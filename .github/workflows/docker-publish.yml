name: Build and Push Development Images

# Builds development/preview images for branch pushes.
# Production releases are handled by release.yml on tag push.
# NOTE: This workflow MUST NOT push the `latest` tag, since the updater
# requires immutable version tags to roll back reliably.

on:
  push:
    branches:
      - main
      - preview
      - beta
  workflow_dispatch:
    inputs:
      tag:
        description: "Override docker image tag (optional)"
        required: false

env:
  REGISTRY: docker.io
  BACKEND_IMAGE_NAME: myriad-backend
  FRONTEND_IMAGE_NAME: myriad-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=dev-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          # latest is intentionally omitted; release.yml owns release tags.

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=dev-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          build-args: |
            MYRIAD_VERSION=dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: true
          build-args: |
            PACKAGE_MANAGER=pnpm
            PNPM_VERSION=9.15.4
            MYRIAD_VERSION=dev-${{ github.sha }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Summary
        run: |
          {
            echo "## Development images pushed"
            echo ""
            echo "### Backend"
            echo '```'
            echo "${{ steps.meta-backend.outputs.tags }}"
            echo '```'
            echo ""
            echo "### Frontend"
            echo '```'
            echo "${{ steps.meta-frontend.outputs.tags }}"
            echo '```'
            echo ""
            echo "> Production releases (with \`release.json\` manifest) are published by \`release.yml\` on \`v*\` tag pushes."
          } >> "$GITHUB_STEP_SUMMARY"
