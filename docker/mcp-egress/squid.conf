# One proxy per reviewed tool, on a private network. Never publish this port.
http_port 3128
visible_hostname myriad-mcp-egress
cache_effective_user nobody
max_filedescriptors 1024
pid_filename /tmp/squid.pid
coredump_dir /tmp
cache_log /tmp/cache.log
access_log none
cache_store_log none
cache deny all
cache_mem 8 MB
maximum_object_size 0 KB
shutdown_lifetime 1 seconds
connect_timeout 5 seconds
request_timeout 10 seconds
read_timeout 30 seconds
request_header_max_size 16 KB
request_body_max_size 4 MB
reply_body_max_size 16 MB all
client_db off
forwarded_for delete
via on
# Never reverse-resolve numeric URL authorities into an approved hostname.
acl approved dstdomain -n "/etc/squid/allowed-domains.txt"
acl local_names dstdomain -n localhost .localhost
acl CONNECT method CONNECT
acl tls_port port 443
acl safe_ports port 80 443
# Includes local, private, metadata, shared, benchmark, multicast and transition
# ranges. Deny IPv6 here; this small deployment deliberately uses public IPv4.
acl private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/0
http_access deny !safe_ports
http_access deny CONNECT !tls_port
http_access deny local_names
http_access deny !approved
http_access deny private
http_access allow approved
http_access deny all
