[package]
name = "myriad-phantasi-notes"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pure Phantasi note rules: Markdown rendering, sanitization, and derived article fields."
authors = ["Myriad Contributors"]

[dependencies]
ammonia = "4.1"
myriad-phantasi = { path = "../myriad-phantasi" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = "1"
