# Optional overlay for ONE reviewed tool. Use with docker-compose.mcp-gateway.example.yml.
# Remove the state or egress blocks independently when that capability is unnecessary.
services:
  mcp-approved:
    environment:
      MCP_NETWORK: proxy
      MCP_PERSIST_STATE: "true"
    volumes:
      - mcp_state:/var/lib/mcp-state
    networks: [mcp, egress_private]
    depends_on:
      egress: {condition: service_healthy}
  egress:
    image: ${MCP_EGRESS_IMAGE:?Build and pin docker/mcp-egress/Dockerfile}
    user: "65534:65534"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - type: bind
        source: ${MCP_ALLOWED_DOMAINS_FILE:?Absolute path to this tool's approved domains}
        target: /etc/squid/allowed-domains.txt
        read_only: true
        bind: {create_host_path: false}
    networks: [egress_private, internet]
    ulimits:
      nofile: {soft: 1024, hard: 1024}
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 32
    restart: on-failure
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 3128), 1).close()"]
      interval: 10s
      start_period: 5s
      timeout: 2s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
volumes:
  mcp_state:
    external: true
    name: ${MCP_STATE_VOLUME:?Provision a dedicated bounded filesystem first}
networks:
  egress_private: {internal: true}
  internet: {}
