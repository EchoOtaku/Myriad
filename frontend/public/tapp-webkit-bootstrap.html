<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tapp WebKit Bootstrap</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b1220; }
    #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:14px; }
  </style>
</head>
<body>
  <div id="status">BOOTSTRAP: waiting for html…</div>
  <script>
    (function(){
      function post(kind, extra){
        try {
          (window.parent && window.parent.postMessage) && window.parent.postMessage({ __tapp_webkit_bootstrap: true, kind: kind, t: Date.now(), extra: extra || null }, '*');
        } catch (e) {}
      }

      post('ready');

      window.addEventListener('message', function(e){
        var msg = e.data;
        if (!msg || typeof msg !== 'object') return;
        if (msg.__tapp_webkit_bootstrap !== true) return;
        if (msg.kind === 'load-html') {
          try {
            var html = msg.html;
            if (typeof html !== 'string' || html.length === 0) {
              document.getElementById('status').textContent = 'BOOTSTRAP: empty html';
              post('error', 'empty-html');
              return;
            }
            document.getElementById('status').textContent = 'BOOTSTRAP: writing…';
            // 在 iframe 自己的 JS 里 document.write（比父页面写入更兼容）
            document.open();
            document.write(html);
            document.close();
            post('written');
          } catch (err) {
            try { document.getElementById('status').textContent = 'BOOTSTRAP: write error'; } catch (e2) {}
            post('error', String(err));
          }
        }
      });
    })();
  </script>
</body>
</html>
