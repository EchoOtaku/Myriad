# Myriad 本地开发 Docker Compose 配置
#
# 仅启动 PostgreSQL 数据库供本地开发使用：
#   - backend: 在宿主机 `cargo run --bin myriad-backend`
#   - frontend: 在宿主机 `pnpm dev`（frontend/）
#
# 使用方法:
#   启动: docker compose -f docker-compose.dev.yml up -d
#   停止: docker compose -f docker-compose.dev.yml down
#   日志: docker compose -f docker-compose.dev.yml logs -f
#
# ============================================================================
# 与生产部署 (docker-compose.yml) 的区别
# ============================================================================
# 本文件**不**启动 proxy 和 updater，因此 updater 功能在 dev 模式下不可用。
# 若要本地验证 updater 完整流程（拉镜像 / 文件级快照 / 自更新 helper），
# 请使用 docker-compose.yml 配合 scripts/migrate-to-updater.sh。
#
# pgdata 也使用独立 named volume (postgres_dev_data)，避免污染生产 ./pgdata。
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: myriad-postgres-dev
    environment:
      POSTGRES_DB: myriad
      POSTGRES_USER: myriad
      POSTGRES_PASSWORD: myriad_dev_password
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C --lc-collate=C --lc-ctype=C"
      TZ: Asia/Shanghai
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myriad -d myriad"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
