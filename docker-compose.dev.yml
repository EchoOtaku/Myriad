# Myriad 本地开发 Docker Compose 配置
#
# 默认仅启动 PostgreSQL 数据库供本地开发使用：
#   - backend: 在宿主机 `cargo run --bin myriad-backend`
#   - frontend: 在宿主机 `pnpm dev`（frontend/）
#
# 使用方法:
#   启动 DB: docker compose -f docker-compose.dev.yml up -d postgres
#   启动 updater 测试 harness: ./scripts/dev/dev.sh start updater
#   停止: docker compose -f docker-compose.dev.yml down
#   日志: docker compose -f docker-compose.dev.yml logs -f
#
# ============================================================================
# 与生产部署 (docker-compose.yml) 的区别
# ============================================================================
# 本文件默认不启动 proxy/updater；updater 通过 profile 按需启动，并暴露到
# 127.0.0.1:1101 供宿主机 backend 的 /api/admin/updater/* 代理测试。
# 若要验证真实业务容器替换流程，请使用 docker-compose.yml 配合
# scripts/docker/deploy.sh。
#
# pgdata 也使用独立 named volume (postgres_dev_data)，避免污染生产 ./pgdata。
# ============================================================================

services:
  postgres:
    image: postgres:18-alpine
    container_name: myriad-postgres-dev
    environment:
      POSTGRES_DB: myriad
      POSTGRES_USER: myriad
      POSTGRES_PASSWORD: myriad_dev_password
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C --lc-collate=C --lc-ctype=C"
      TZ: Asia/Shanghai
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myriad -d myriad"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  updater:
    profiles: ["updater"]
    build:
      context: .
      dockerfile: updater/Dockerfile
      args:
        MYRIAD_VERSION: ${UPDATER_TAG:-v0.0.0-dev}
    image: ${UPDATER_IMAGE:-myriad-updater-dev}:${UPDATER_TAG:-v0.0.0-dev}
    container_name: myriad-updater-dev
    environment:
      UPDATE_TOKEN: ${UPDATE_TOKEN:-9xQ3vN8mP2rT5wY7zA1bC4dF6hJ8kL0n}
      CHANNEL: ${CHANNEL:-stable}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REGISTRY_MIRROR: ${REGISTRY_MIRROR:-}
      MYRIAD_GITHUB_REPO: ${MYRIAD_GITHUB_REPO:-Myriad-You/Myriad}
      CHECK_INTERVAL_SECS: ${CHECK_INTERVAL_SECS:-0}
      UPDATER_STATE_DIR: /state
      UPDATER_COMPOSE_DIR: /host/compose
      UPDATER_ENV_FILE: /host/compose/.env
      UPDATER_PGDATA: /host/pgdata
      UPDATER_LISTEN: 0.0.0.0:1101
      COMPOSE_PROJECT_NAME: myriad-dev-updater
      MYRIAD_VERSION: ${UPDATER_TAG:-v0.0.0-dev}
      TZ: Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.dev-updater:/host/compose
      - ./.dev-updater/pgdata:/host/pgdata
      - ./.dev-updater/state:/state
      - ./.dev-updater/backups:/backups
    ports:
      - "127.0.0.1:1101:1101"
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
